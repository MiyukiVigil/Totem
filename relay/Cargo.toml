[package]
name = "totem-relay"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Totem relay: forwards end-to-end encrypted messages between paired devices and wakes phones via FCM"

[dependencies]
totem-protocol = { path = "../protocol" }
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
jsonwebtoken = "9"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4", features = ["derive", "env"] }

[dev-dependencies]
tokio-tungstenite = "0.24"
