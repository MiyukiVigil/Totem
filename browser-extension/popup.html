<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Totem</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <input id="search" placeholder="Search accounts…" autocomplete="off" spellcheck="false" autofocus>
  </header>
  <ul id="list" class="list" role="listbox" aria-label="Accounts"></ul>
  <div id="empty" class="empty hidden"></div>
  <div id="shown-code" class="shown-code hidden"></div>
  <footer>
    <span id="status" class="muted">↑↓ choose · Enter fill</span>
  </footer>
  <script type="module" src="popup.js"></script>
</body>
</html>
