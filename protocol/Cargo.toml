[package]
name = "totem-protocol"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Shared Totem protocol: OTP engine, Noise sessions, relay and app messages"

[dependencies]
hmac = "0.12"
sha1 = "0.10"
sha2 = "0.10"
snow = "0.9"
thiserror = "1"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
urlencoding = "2"
