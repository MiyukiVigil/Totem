# Totem relay on Cloudflare (free plan is plenty for personal use).
# Deploy:  npx wrangler login && npx wrangler deploy
# Pushes:  npx wrangler secret put FCM_SERVICE_ACCOUNT < ~/.secrets/<firebase-adminsdk>.json
name = "totem-relay"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "RELAY"
class_name = "Relay"

# SQLite-backed Durable Objects are the ones available on the free plan.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Relay"]

[observability]
enabled = true
