[package]
name = "totem-desktop"
version = "0.4.0"
edition.workspace = true
license.workspace = true
description = "Totem for Windows: tray app, Ctrl+Shift+A to fetch a 2FA code from your phone"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
totem-client = { path = "../../client" }
totem-protocol = { path = "../../protocol" }
totem-relay = { path = "../../relay" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["sync", "time", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
axum = "0.7"
tracing = "0.1"
dirs = "5"
tauri-plugin-autostart = "2"
mdns-sd = "0.13"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_System_WinRT", "Win32_Foundation", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry"] }
windows-future = "0.3"
