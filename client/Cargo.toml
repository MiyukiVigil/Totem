[package]
name = "totem-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "PC side of Totem: keys, pairing and code requests (shared by the CLI and the desktop app)"

[dependencies]
totem-protocol = { path = "../protocol" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
# ring as the only crypto provider (aws-lc-rs needs cmake + NASM on Windows).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand = "0.8"
hex = "0.4"
dirs = "5"
sha2 = "0.10"
chacha20poly1305 = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }

[target.'cfg(windows)'.dependencies]
# Windows Hello key credentials (hello_key.rs).
windows = { version = "0.62", features = ["Security_Credentials", "Security_Cryptography", "Storage_Streams", "Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }
windows-core = "0.62"
windows-future = "0.3"

[dev-dependencies]
totem-relay = { path = "../relay" }
axum = "0.7"
